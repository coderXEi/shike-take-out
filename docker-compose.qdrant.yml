# Qdrant 向量数据库 —— 仅本地开发使用（最小化功能）
#
# 只启用 RAG 检索所需的必要能力：
#   - 单节点、无集群分片（默认）
#   - 关闭 TLS（本地明文即可）
#   - 关闭匿名遥测
#   - 仅暴露 REST(6333) 与 gRPC(6334)；langchain4j-qdrant 走 gRPC，故 6334 是必须的
#
# 常用命令：
#   docker compose -f docker-compose.qdrant.yml up -d      # 启动
#   docker compose -f docker-compose.qdrant.yml ps         # 查看状态
#   docker compose -f docker-compose.qdrant.yml logs -f    # 查看日志
#   docker compose -f docker-compose.qdrant.yml down       # 停止（保留数据卷）
#   docker compose -f docker-compose.qdrant.yml down -v    # 停止并删除数据
#
# 验证：
#   curl http://localhost:6333/readyz          # 就绪探针
#   curl http://localhost:6333/collections     # 列出集合
#   浏览器打开 http://localhost:6333/dashboard # Web 控制台

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: shike-qdrant
    restart: unless-stopped

    # 仅暴露必要端口：REST 用于调试/控制台，gRPC 用于 langchain4j 客户端
    ports:
      - "6333:6333"   # REST / Web dashboard
      - "6334:6334"   # gRPC（langchain4j-qdrant 使用）

    volumes:
      # 持久化向量数据与快照；命名卷由 compose 管理，避免污染项目目录
      - qdrant_storage:/qdrant/storage

    environment:
      # 关闭匿名遥测（无数据外发）
      QDRANT__TELEMETRY_DISABLED: "true"
      # 本地不启用 TLS
      QDRANT__SERVICE__ENABLE_TLS: "false"
      # 日志级别，本地开发只保留必要信息
      QDRANT__LOG_LEVEL: "INFO"
      # 单节点、无需分布式共识；本地不设置 API Key（如需鉴权，配置 QDRANT__SERVICE__API_KEY）
      QDRANT__CLUSTER__ENABLED: "false"

    # 限制资源，避免本地开发占满内存
    deploy:
      resources:
        limits:
          memory: 1g

    # 就绪探针：官方镜像自带 bash，用 /dev/tcp 做 TCP 探测即可
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    name: shike_qdrant_storage
